# Pass A ("profiles") locations. One rule per line, fields separated by '|', blanks trimmed:
#
#   scope | match | kind | category | preselect | pattern | label
#
# scope   root    pattern = profile directories relative to the volume root; match = os_hint
#                 list the rule applies to; kind = profile family (winxp, win7, linux, macos)
#                 whose bucket/skip rules are used; label = prefix shown before the user name.
#         skip    profile names (globs) not treated as users; match = family list.
#         bucket  location relative to a profile; match = family list.
#         whole   one "entire profile" group per user; match = family list.
#         system  location relative to the volume root; match = os_hint list; user is "-".
# kind    dir     the location is a directory (copied recursively)
#         file    the location is a single file
#         find    pattern is a file name glob searched anywhere under the profile; every hit
#                 becomes its own single-file group (Outlook .pst/.ost)
# category  photos videos documents email music archives other, or "auto" (majority of the
#           files found, by extension, see categories.conf)
# preselect 1 = ticked in the checklist by default
# pattern   path relative to the profile/volume; '*' matches one path component; matching
#           ignores case (NTFS and FAT are case-insensitive, and so are we). Symlinks and
#           NTFS junctions (Vista+ "Documents and Settings", "My Documents", ...) never match.
# label     text shown after "<user> / "; %b = the basename of the match. When a pattern
#           matches several directories, " (2)", " (3)" ... is appended.

# ---------------------------------------------------------------- profile roots
root   | winxp            | winxp | - | - | Documents and Settings/*               |
root   | win7             | win7  | - | - | Users/*                                |
root   | win7,winxp       | win7  | - | - | Windows.old/Users/*                    | Windows.old /
root   | win7,winxp       | winxp | - | - | Windows.old/Documents and Settings/*   | Windows.old /
root   | linux            | linux | - | - | home/*                                 |
root   | linux            | linux | - | - | root                                   |
root   | macos            | macos | - | - | Users/*                                |

