# Directories (and files) pruned by the scanner. Pass B (sweep) applies every line; pass A
# (profiles) and the copy stage apply only "iname" lines, so a profile's Temp and browser
# caches are neither counted nor copied.
#
# Format: <os-list|*> <kind> <pattern>
#   os-list  comma separated os_hint values (winxp,win7,linux,macos,data) or * for all
#   kind     iname  pattern matches a file or directory name at any depth (case-insensitive)
#            ipath  pattern is relative to the volume root (case-insensitive; * may span '/')
# Patterns are find(1) globs; the rest of the line after the kind is the pattern.

# --- Windows system areas (also on secondary disks: Program Files on D: is common) ---
*                      ipath Windows
*                      ipath WINNT
*                      ipath WIN98
*                      ipath Program Files*
*                      ipath ProgramData
*                      ipath MSOCache
*                      ipath I386
*                      ipath Config.Msi
*                      ipath PerfLogs
*                      ipath Recovery
*                      ipath Boot
*                      ipath $WINDOWS.~BT
*                      ipath $WINDOWS.~WS
*                      ipath $SysReset
*                      ipath $GetCurrent
*                      ipath Windows.old/Windows
*                      ipath Windows.old/WINNT
*                      ipath Windows.old/Program Files*
*                      ipath Windows.old/ProgramData
*                      iname System Volume Information
*                      iname $Recycle.Bin
*                      iname RECYCLER
*                      iname RECYCLED
*                      iname pagefile.sys
*                      iname hiberfil.sys
*                      iname swapfile.sys
*                      iname Temporary Internet Files
*                      iname INetCache
*                      iname Temp
*                      iname Cache*
*                      iname node_modules
*                      iname lost+found
*                      iname .Trash-*
*                      iname .Trashes
*                      iname .Spotlight-V100
*                      iname .fseventsd
*                      iname .DocumentRevisions-V100
*                      iname .cache

# --- Linux system areas (only on volumes detected as linux) ---
linux                  ipath usr
linux                  ipath lib*
linux                  ipath bin
linux                  ipath sbin
linux                  ipath boot
linux                  ipath dev
linux                  ipath proc
linux                  ipath sys
linux                  ipath run
linux                  ipath tmp
linux                  ipath etc
linux                  ipath opt
linux                  ipath snap
linux                  ipath var/cache
linux                  ipath var/lib
linux                  ipath var/log
linux                  ipath var/tmp
linux                  ipath var/run
linux                  ipath var/lock
linux                  ipath var/spool

# --- macOS system areas ---
macos                  ipath System
macos                  ipath Library
macos                  ipath Applications
macos                  ipath private
macos                  ipath cores
macos                  ipath Volumes
macos                  ipath usr
macos                  ipath bin
macos                  ipath sbin
macos                  ipath opt
